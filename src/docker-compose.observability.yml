# Quan sát cục bộ: Jaeger nhận trace qua OTLP. Chạy kèm file chính:
#   docker compose -f src/docker-compose.yml -f src/docker-compose.observability.yml up --build -d
services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      # Chỉ bind loopback: giao diện và cổng OTLP không mở ra mạng ngoài (docker.md).
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  board-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - jaeger
