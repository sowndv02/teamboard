# Local observability: Jaeger receives traces over OTLP. Run alongside the main file:
#   docker compose -f src/docker-compose.yml -f src/docker-compose.observability.yml up --build -d
services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      # Bind to loopback only: the UI and OTLP ports are not exposed to the outside network (docker.md).
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  board-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - jaeger

  gateway:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - jaeger
