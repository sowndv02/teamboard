services:
  board-service:
    image: board-service
    build:
      context: .
      dockerfile: board-service/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:7070
    ports:
      - "6060:7070"
    restart: unless-stopped

  # Single entry point for clients. No depends_on: the gateway must be live and ready independently of its upstreams (FR-002).
  gateway:
    image: gateway
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:7070
      ReverseProxy__Clusters__board-service__Destinations__d1__Address: http://board-service:7070
    ports:
      - "8080:7070"
    restart: unless-stopped

  # No gateway route yet (slice 19 of identity-auth); call it directly on port 6061 for debugging.
  identity-service:
    image: identity-service
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:7070
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=identity;Username=identity;Password=${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in src/.env (template: src/.env.example)}"
      # Migrations are applied automatically only locally and in compose; the service default is off (backend-engineering.md section 7).
      Database__MigrateOnStartup: "true"
    ports:
      - "6061:7070"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One shared PostgreSQL instance in dev (design D0.2); each service has its own database and user, created by postgres/init.
  # No port is published to the host: only services on the compose network can reach it.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in src/.env (template: src/.env.example)}"
      IDENTITY_DB_PASSWORD: "${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in src/.env (template: src/.env.example)}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP (127.0.0.1): the temporary server used during initialization listens only on a socket, so it is healthy only after the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
