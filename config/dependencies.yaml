  - { name: Jaeger (image cr.jaegertracing.io/jaegertracing/jaeger:2.22.0), tier: T1, status: approved, license: Apache-2.0, verified: true, source: "https://github.com/jaegertracing/jaeger/blob/main/LICENSE", note: "CNCF; pin tag 2.22.0 (TB-001); OTLP bật sẵn trong all-in-one chưa xác nhận, kiểm ở B5" }
