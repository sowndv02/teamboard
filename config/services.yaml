# Danh sách service. status: existing | planned
# Kiến trúc và lưu trữ: xem document/architecture/README.md §1

services:
  gateway:
    status: existing
    path: src/gateway
    architecture: api-gateway (YARP)
    datastore: none
    local_port: 8080            # host; container nghe 7070 (docker-compose.yml)
    container_port: 7070
    health: { live: /health/live, ready: /health/ready }

  web:
    status: planned            # theo ADR 0009; chưa scaffold
    path: src/web
    architecture: angular-feature-based (standalone + signals, zoneless)
    datastore: none
    local_port: TODO            # ng serve mặc định 4200
    talks_to: gateway           # chỉ gọi /api/v1 qua gateway
    health: none                # tĩnh; kiểm bằng smoke e2e

  identity-service:
    status: planned
    architecture: vertical-slice
    datastore: postgresql
    local_port: TODO
    health: { live: /health/live, ready: /health/ready }

  board-service:
    status: existing
    path: src/board-service
    architecture: clean-architecture
    datastore: sqlserver
    local_port: 6060            # host; container nghe 7070 (docker-compose.yml)
    container_port: 7070
    health: { live: /health/live, ready: /health/ready }

  task-service:
    status: planned
    architecture: cqrs-event-sourcing + outbox
    datastore: postgresql
    local_port: TODO
    health: { live: /health/live, ready: /health/ready }

  notification-service:
    status: planned
    architecture: hexagonal
    datastore: dynamodb
    local_port: TODO
    health: { live: /health/live, ready: /health/ready }

  activity-service:
    status: planned
    architecture: serverless-event-driven
    datastore: dynamodb
    local_port: TODO
    health: { live: /health/live, ready: /health/ready }

messaging:
  topic: teamboard-events       # SNS; mỗi consumer một SQS queue + DLQ
  event_fields: [eventId, type, occurredAt, correlationId, version]
